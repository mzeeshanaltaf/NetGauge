name = "netgauge-worker"
main = "src/index.ts"
compatibility_date = "2026-09-07"

[observability]
enabled = true

# Caps bandwidth/the 100k req/day free tier per IP. Applied only to
# /download and /upload (the bandwidth-heavy routes) — see src/index.ts.
# period is CF's simple-rate-limiting max granularity (10 or 60s only).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 100, period = 60 }
